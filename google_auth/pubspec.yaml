name: tekartik_google_auth
description: >-
  Common (dart only) base for google authentication, implemented by
  tekartik_google_auth_flutter and tekartik_google_auth_io.
version: 0.4.0
publish_to: none
repository: https://github.com/tekartik/google_auth.dart

environment:
  sdk: ^3.12.0

dependencies:
  googleapis_auth: ">=1.2.0"
  http: ">=1.2.0"
  meta: ">=1.16.0"
  tekartik_common_utils:
    git:
      url: https://github.com/tekartik/common_utils.dart
    version: '>=0.10.2+1'

dev_dependencies:
  tekartik_lints:
    git:
      url: https://github.com/tekartik/common.dart
      path: packages/lints
    version: '>=0.1.0'
  test: ^1.25.6
resolution: workspace
