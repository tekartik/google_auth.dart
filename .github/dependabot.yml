# Dependabot configuration file.
# See https://docs.github.com/en/code-security/dependabot/dependabot-version-updates
version: 2

enable-beta-ecosystems: true
updates:
  - package-ecosystem: "pub"
    directory: "."
    schedule:
      interval: "monthly"

  - package-ecosystem: "pub"
    directory: "google_auth"
    schedule:
      interval: "monthly"

  - package-ecosystem: "pub"
    directory: "google_auth_flutter"
    schedule:
      interval: "monthly"

  - package-ecosystem: "pub"
    directory: "google_auth_io"
    schedule:
      interval: "monthly"

  - package-ecosystem: "pub"
    directory: "google_auth_test"
    schedule:
      interval: "monthly"

  - package-ecosystem: "pub"
    directory: "repo_support"
    schedule:
      interval: "monthly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - autosubmit
