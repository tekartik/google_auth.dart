name: tekartik_google_auth_test
description: >-
  Common tests and dev menu for the tekartik_google_auth implementations
  (tekartik_google_auth_flutter, tekartik_google_auth_io).
version: 0.1.0
publish_to: none
repository: https://github.com/tekartik/google_auth.dart

environment:
  sdk: ^3.12.0

dependencies:
  test: ">=1.31.0"
  tekartik_app_dev_menu:
    git:
      url: https://github.com/tekartik/app_common_utils.dart
      path: app_dev_menu
  tekartik_common_utils:
    git:
      url: https://github.com/tekartik/common_utils.dart
    version: '>=0.10.2+1'
  tekartik_google_auth:
    path: ../google_auth

dev_dependencies:
  dev_build: ">=1.1.7+3"
  tekartik_google_auth_io:
    path: ../google_auth_io
  process_run: ">=1.2.1+1"
  tekartik_lints:
    git:
      url: https://github.com/tekartik/common.dart
      path: packages/lints
    version: '>=0.1.0'
resolution: workspace
